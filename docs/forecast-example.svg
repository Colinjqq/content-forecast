<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Content Forecast propagation prediction card</title>
<desc id="desc">An illustrative card showing spread point, drop-off, audience, and direction relative to a temporary baseline.</desc>
<rect width="1200" height="650" rx="36" fill="#111111"/>
<text x="64" y="62" fill="#ff6b25" font-family="Arial, sans-serif" font-size="20" font-weight="700">CONTENT FORECAST · EXAMPLE</text>
<text x="64" y="112" fill="#f5efe4" font-family="Arial, sans-serif" font-size="36" font-weight="700">HOW THIS CONTENT MAY SPREAD</text>
<rect x="64" y="145" width="1072" height="2" fill="#393939"/>
<rect x="64" y="180" width="520" height="108" rx="20" fill="#173c26"/>
<text x="92" y="217" fill="#7ee2a8" font-family="Arial, sans-serif" font-size="18" font-weight="700">● STRONGEST SPREAD POINT</text>
<text x="92" y="257" fill="#f5efe4" font-family="Arial, sans-serif" font-size="23">A counter-intuitive opening with a real result</text>
<rect x="616" y="180" width="520" height="108" rx="20" fill="#441f24"/>
<text x="644" y="217" fill="#ff858f" font-family="Arial, sans-serif" font-size="18" font-weight="700">● FIRST LIKELY DROP-OFF</text>
<text x="644" y="257" fill="#f5efe4" font-family="Arial, sans-serif" font-size="23">Repeated explanation before the first case</text>
<rect x="64" y="312" width="520" height="108" rx="20" fill="#242424" stroke="#494949" stroke-width="2"/>
<text x="92" y="349" fill="#b6b1a8" font-family="Arial, sans-serif" font-size="18" font-weight="700">👥 LIKELY AUDIENCE</text>
<text x="92" y="389" fill="#f5efe4" font-family="Arial, sans-serif" font-size="23">People turning AI skills into paid work</text>
<rect x="616" y="312" width="520" height="108" rx="20" fill="#3d3217"/>
<text x="644" y="349" fill="#f5cf62" font-family="Arial, sans-serif" font-size="18" font-weight="700">● LARGEST VARIABLE</text>
<text x="644" y="389" fill="#f5efe4" font-family="Arial, sans-serif" font-size="23">Whether the proof appears on screen early</text>
<rect x="64" y="452" width="1072" height="124" rx="22" fill="#f3ecdf"/>
<text x="92" y="493" fill="#656057" font-family="Arial, sans-serif" font-size="18" font-weight="700">RELATIVE TO YOUR TEMPORARY CONTENT BASELINE</text>
<text x="92" y="551" fill="#111111" font-family="Arial, sans-serif" font-size="42" font-weight="700">↗  +15% to +35%</text>
<rect x="856" y="498" width="238" height="46" rx="23" fill="#f3c43b"/>
<text x="975" y="528" text-anchor="middle" fill="#332600" font-family="Arial, sans-serif" font-size="18" font-weight="700">MEDIUM CONFIDENCE</text>
<text x="64" y="620" fill="#77736d" font-family="Arial, sans-serif" font-size="16">Illustrative format · Direction and conditions matter more than false precision</text>
</svg>
